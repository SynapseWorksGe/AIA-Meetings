services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - audio_data:/data/audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A src.api.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - audio_data:/data/audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aia
      POSTGRES_PASSWORD: aia_password
      POSTGRES_DB: aia_meetings
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aia -d aia_meetings"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  audio_data:
